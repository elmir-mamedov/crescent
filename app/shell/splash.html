<script>
(function () {
  // The window calls crescentReady() once its first page has loaded: the ticker
  // folds into a crescent moon, which waxes to full and wanes to the opposite
  // crescent with rays off its lit edge, then the page says "done".
  var NS = "http://www.w3.org/2000/svg", R = 22, MAX = 34, GAP = 2.5;
  var T0 = R * Math.cos(40 * Math.PI / 180), SPAN = T0 + R;
  var WAX = .7, WANE = 1.15, PWANE = 2.6, PWAX = PWANE * WAX / WANE;
  var GLOW = "rgba(230,237,243,.45)";
  function $(id) { return document.getElementById(id); }
  function make(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }
  var blades = [], rays = [], ready = false, played = false, finished = false;
  // Whether this page has been on screen yet: its window shows it once loaded.
  var seen = !document.hidden;
  for (var i = 0; i < 6; i++) {
    var g = make("g", { transform: "rotate(" + i * 60 + " 32 32)" }, $("blades"));
    blades.push(make("path", { d: $("blade").getAttribute("d"), fill: "#4493f8", "class": "b c", style: "animation-delay:" + (i * .2 - 1.2) + "s" }, g));
  }
  for (var k = 0; k < 36; k++) {
    var line = make("line", { pathLength: 1, stroke: "url(#rayfade)", "stroke-dasharray": 1 }, $("rays"));
    line.style.strokeDashoffset = "1";
    rays.push(line);
  }

  function draw(v, lit) {
    var side = v < .5 ? -1 : 1;
    var term = v < .5 ? T0 - SPAN * Math.pow(v / .5, PWAX) : -R + SPAN * (1 - Math.pow(1 - (v - .5) / .5, PWANE));
    var xt = 32 + side * term;
    $("litpath").setAttribute("d", "M32 " + (32 - R) + " A" + R + " " + R + " 0 0 " + (side < 0 ? 0 : 1) + " 32 " + (32 + R) +
      " A" + Math.abs(term) + " " + R + " 0 0 " + (xt < 32 ? 1 : 0) + " 32 " + (32 - R) + "Z");
    var boost = v < .5 ? 0 : Math.sin(Math.min(1, (v - .5) / .4) * Math.PI / 2), reach = MAX * (1 + .5 * boost);
    $("rayfade").setAttribute("r", 24.5 + reach);
    $("rayfade0").setAttribute("offset", 24.5 / (24.5 + reach));
    for (var k = 0; k < 36; k++) {
      var t = k * 10 * Math.PI / 180, cu = side * Math.cos(t), sn = Math.sin(t);
      var rho = Math.abs(cu) < 1e-6 ? R : 1 / Math.sqrt(cu * cu / (term * term) + sn * sn / (R * R));
      var start = R, thick;
      if (cu >= 0) thick = term > 0 && side < 0 ? R - rho : R;
      else if (term >= 0) thick = 0;
      else { start = rho; thick = rho; }
      var g = Math.max(0, thick / R), hot = side > 0 && cu >= 0 ? boost : 0;
      var len = MAX * (.55 * Math.pow(g, .6) + .45 * g * g) * (k % 2 ? .55 : 1) * (1 + .5 * hot);
      var r0 = start + GAP, r1 = r0 + len, l = rays[k];
      l.setAttribute("x1", 32 + r0 * Math.cos(t)); l.setAttribute("y1", 32 + r0 * Math.sin(t));
      l.setAttribute("x2", 32 + r1 * Math.cos(t)); l.setAttribute("y2", 32 + r1 * Math.sin(t));
      l.setAttribute("stroke-width", (k % 2 ? 1 : 1.6) * (1 + .4 * hot));
      l.setAttribute("opacity", Math.min(1, g / .08));
    }
    $("rays").style.filter = boost > 0 ? "drop-shadow(0 0 " + 3 * boost + "px " + GLOW + ")" : "none";
    $("lit").style.filter = lit ? "drop-shadow(0 0 " + (6 + 9 * boost) + "px " + GLOW + ")" : "none";
  }

  function done() {
    if (finished) return;
    finished = true;
    try { window.webkit.messageHandlers.splash.postMessage("done"); } catch (e) {}
    try { window.chrome.webview.postMessage("done"); } catch (e) {}
  }

  // A window covered by another gets no frames to play the moon in, and no
  // one would see it: once ready, a page hidden after being on screen says
  // "done" at once.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (ready) done();
      return;
    }
    seen = true;
    if (ready) play();
  });

  function rise() {
    rays.forEach(function (l, k) {
      var delay = Math.min(Math.abs(k * 10 - 180), 105) / 105 * .4;
      l.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1) " + delay + "s";
      l.style.strokeDashoffset = "0";
    });
    var t0 = performance.now();
    (function frame(now) {
      var e = Math.max(0, (now - t0) / 1000);
      draw(e < WAX ? .5 * e / WAX : .5 + .5 * Math.min(1, (e - WAX) / WANE), true);
      if (e < WAX + WANE) requestAnimationFrame(frame);
      else setTimeout(done, 250);
    })(t0);
  }

  window.crescentStatus = function (text) {
    if (!ready) $("status").textContent = text;
  };

  window.crescentReady = function () {
    if (ready) return;
    ready = true;
    if (!document.hidden) play();
    else if (seen) done();
    // Not on screen yet, as its window is only now showing it: play once it
    // is, or say "done" should it stay hidden.
    else setTimeout(function () { if (document.hidden) done(); }, 500);
  };

  function play() {
    if (played || finished) return;
    played = true;
    blades.forEach(function (b) {
      b.style.animation = "none";
      b.style.opacity = "1";
      b.style.transition = "opacity .15s, transform .25s cubic-bezier(.5,0,.75,0)";
    });
    setTimeout(function () {
      blades.forEach(function (b) { b.style.opacity = "0"; b.style.transform = "scale(.2) rotate(70deg)"; });
      var moon = $("moon");
      moon.style.transition = "transform .8s cubic-bezier(.34,1.56,.64,1), opacity .3s";
      moon.style.opacity = "1";
      moon.style.transform = "rotate(-90deg) scale(1)";
      var status = $("status");
      status.textContent = "Ready";
      status.style.color = "#e6edf3";
      setTimeout(rise, 300);
    }, 150);
  }

  draw(0, false);
})();
</script>
