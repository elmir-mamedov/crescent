name: Release

# Push a tag vX.Y.Z matching app/package.json's version: this builds kb25.zip,
# installs it for real on macOS and Windows, and only then publishes it, with
# install.sh and install.ps1, as the GitHub Release the one-liners download.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # macOS, to build KB25's macOS window with swiftc; the .NET SDK builds the
    # Windows one here too.
    runs-on: macos-latest
    steps:
      # Every change reaches main through a pull request that CI passed, so a
      # release is cut from main: a tag on any other commit stops here. The
      # compare reads "behind" or "identical" when the tag is in main's history.
      - name: Tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::$GITHUB_REF_NAME is not on main ($status). Merge its pull request, then tag main."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: app
      - name: Tag matches app/package.json
        run: test "v$(node -p "require('./app/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run build:release
        working-directory: app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/kb25.zip
            dist/install.sh
            dist/install.ps1
            dist/VERSION

  test-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KB25_YES: "1"
      KB25_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: KB25_ZIP="$PWD/release/kb25.zip" bash release/install.sh
      - name: Install (Windows, as `irm | iex` would)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:KB25_ZIP = "$PWD\release\kb25.zip"
          Get-Content release\install.ps1 -Raw | Invoke-Expression
      # The viewer's Update button runs the installer with no terminal and
      # nobody to answer: it must stop the server, swap the app in and start
      # the server again without asking anything. Posing as 0.0.0 makes the
      # same zip count as an update. A copy of the launcher under its KB25
      # name stands in for one 0.12.0 and earlier left, which the update
      # must remove, and the launcher itself takes the capitalized name it
      # had through 0.22.0, which the update must write in lowercase again
      # (renamed by way of another name, which a disk that ignores case
      # needs for a change of case alone).
      - name: Update without a terminal (macOS)
        if: runner.os == 'macOS'
        run: |
          echo 0.0.0 > "$HOME/Library/Application Support/KB25/app/VERSION"
          cp -R "$HOME/Applications/crescent.app" "$HOME/Applications/KB25.app"
          mv "$HOME/Applications/crescent.app" "$HOME/Applications/renaming.app"
          mv "$HOME/Applications/renaming.app" "$HOME/Applications/Crescent.app"
          env -u KB25_YES KB25_UPDATE=1 KB25_ZIP="$PWD/release/kb25.zip" bash release/install.sh < /dev/null
      - name: Update without a terminal (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-Content "$env:LOCALAPPDATA\KB25\app\VERSION" '0.0.0'
          $programs = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          Copy-Item "$programs\crescent.lnk" "$programs\KB25.lnk"
          Move-Item "$programs\crescent.lnk" "$programs\renaming.lnk"
          Move-Item "$programs\renaming.lnk" "$programs\Crescent.lnk"
          Remove-Item Env:KB25_YES
          $env:KB25_UPDATE = '1'
          $env:KB25_ZIP = "$PWD\release\kb25.zip"
          Get-Content release\install.ps1 -Raw | Invoke-Expression
      - name: Smoke test and uninstall
        run: node app/scripts/smoke-installed.mjs

  publish:
    needs: test-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - run: >
          gh release create "$GITHUB_REF_NAME"
          release/kb25.zip release/install.sh release/install.ps1 release/VERSION
          --repo "$GITHUB_REPOSITORY" --title "crescent $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
